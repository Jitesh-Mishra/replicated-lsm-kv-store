<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
<rect width="1000" height="520" fill="#0d1117"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
<rect x="30" y="30" width="170" height="70" rx="8" fill="#161b22" stroke="#9198a1" stroke-width="1.8"/><text x="42" y="52" font-weight="600" fill="#e6edf3">Clients</text><text x="42" y="72" font-size="12" fill="#9198a1">PUT / GET / DELETE / scan</text>
<rect x="260" y="20" width="300" height="90" rx="8" fill="#161b22" stroke="#3987e5" stroke-width="1.8"/><text x="272" y="42" font-weight="600" fill="#e6edf3">Leader (FastAPI)</text><text x="272" y="62" font-size="12" fill="#9198a1">/kv, /scan, /admin, /metrics</text><text x="272" y="78" font-size="12" fill="#9198a1">one ordered write path</text>
<line x1="200" y1="65" x2="258" y2="65" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="740" y="20" width="230" height="90" rx="8" fill="#161b22" stroke="#3987e5" stroke-width="1.8"/><text x="752" y="42" font-weight="600" fill="#e6edf3">Follower</text><text x="752" y="62" font-size="12" fill="#9198a1">applies shipped WAL records</text><text x="752" y="78" font-size="12" fill="#9198a1">promote on leader failure</text>
<line x1="560" y1="50" x2="738" y2="50" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/><text x="574" y="42" font-size="11.5" fill="#9198a1">sync: ack after follower</text>
<line x1="560" y1="85" x2="738" y2="85" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="574" y="102" font-size="11.5" fill="#9198a1">async: ship every 50 ms</text>
<rect x="30" y="150" width="940" height="200" rx="10" fill="none" stroke="#6e7681" stroke-dasharray="4 4"/>
<text x="44" y="172" font-weight="600" fill="#9198a1">LSM engine (lsmkv/engine)</text>
<rect x="50" y="190" width="200" height="140" rx="8" fill="#161b22" stroke="#d95926" stroke-width="1.8"/><text x="62" y="212" font-weight="600" fill="#e6edf3">1. WAL</text><text x="62" y="232" font-size="12" fill="#9198a1">CRC per record</text><text x="62" y="248" font-size="12" fill="#9198a1">fsync before ack</text><text x="62" y="264" font-size="12" fill="#9198a1">torn tail truncated</text><text x="62" y="280" font-size="12" fill="#9198a1">on replay</text>
<rect x="280" y="190" width="200" height="140" rx="8" fill="#161b22" stroke="#d95926" stroke-width="1.8"/><text x="292" y="212" font-weight="600" fill="#e6edf3">2. Memtable</text><text x="292" y="232" font-size="12" fill="#9198a1">skip list</text><text x="292" y="248" font-size="12" fill="#9198a1">flush at size limit</text><text x="292" y="264" font-size="12" fill="#9198a1">tombstones for deletes</text>
<rect x="510" y="190" width="210" height="140" rx="8" fill="#161b22" stroke="#199e70" stroke-width="1.8"/><text x="522" y="212" font-weight="600" fill="#e6edf3">3. SSTables</text><text x="522" y="232" font-size="12" fill="#9198a1">sorted, immutable</text><text x="522" y="248" font-size="12" fill="#9198a1">sparse index + bloom</text><text x="522" y="264" font-size="12" fill="#9198a1">whole-file checksum</text><text x="522" y="280" font-size="12" fill="#9198a1">tmp + fsync + rename</text>
<rect x="750" y="190" width="200" height="140" rx="8" fill="#161b22" stroke="#199e70" stroke-width="1.8"/><text x="762" y="212" font-weight="600" fill="#e6edf3">4. Compaction</text><text x="762" y="232" font-size="12" fill="#9198a1">size-tiered k-way merge</text><text x="762" y="248" font-size="12" fill="#9198a1">newest wins</text><text x="762" y="264" font-size="12" fill="#9198a1">drops tombstones</text><text x="762" y="280" font-size="12" fill="#9198a1">at the bottom tier</text>
<line x1="410" y1="110" x2="150" y2="188" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="250" y1="260" x2="278" y2="260" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="480" y1="260" x2="508" y2="260" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="720" y1="245" x2="748" y2="245" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="748" y1="275" x2="722" y2="275" stroke="#6e7681" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="530" y="345" font-size="11.5" fill="#9198a1">MANIFEST (fsync + rename) is the commit point for flushes and compactions</text>
<rect x="30" y="390" width="220" height="110" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.8"/><text x="42" y="412" font-weight="600" fill="#e6edf3">Prometheus</text><text x="42" y="432" font-size="12" fill="#9198a1">8 alert rules (ops/alerts.yml)</text><text x="42" y="448" font-size="12" fill="#9198a1">scrapes /metrics: latency,</text><text x="42" y="464" font-size="12" fill="#9198a1">fsync, backlog, lag, disk</text>
<rect x="280" y="390" width="200" height="110" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.8"/><text x="292" y="412" font-weight="600" fill="#e6edf3">Runbooks</text><text x="292" y="432" font-size="12" fill="#9198a1">one per alert</text><text x="292" y="448" font-size="12" fill="#9198a1">ops/runbooks/</text>
<rect x="510" y="390" width="210" height="110" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.8"/><text x="522" y="412" font-weight="600" fill="#e6edf3">Backup</text><text x="522" y="432" font-size="12" fill="#9198a1">snapshot + archived WAL</text><text x="522" y="448" font-size="12" fill="#9198a1">point-in-time restore</text>
<rect x="750" y="390" width="220" height="110" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.8"/><text x="762" y="412" font-weight="600" fill="#e6edf3">Chaos + CI gate</text><text x="762" y="432" font-size="12" fill="#9198a1">SIGKILL at engine points</text><text x="762" y="448" font-size="12" fill="#9198a1">release blocked unless</text><text x="762" y="464" font-size="12" fill="#9198a1">0 acked writes lost</text>
</svg>
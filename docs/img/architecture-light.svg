<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
<rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="30" y="30" width="170" height="70" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.8"/><text x="42" y="52" font-weight="600" fill="#1f2328">Clients</text><text x="42" y="72" font-size="12" fill="#59636e">PUT / GET / DELETE / scan</text>
<rect x="260" y="20" width="300" height="90" rx="8" fill="#f6f8fa" stroke="#2a78d6" stroke-width="1.8"/><text x="272" y="42" font-weight="600" fill="#1f2328">Leader (FastAPI)</text><text x="272" y="62" font-size="12" fill="#59636e">/kv, /scan, /admin, /metrics</text><text x="272" y="78" font-size="12" fill="#59636e">one ordered write path</text>
<line x1="200" y1="65" x2="258" y2="65" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="740" y="20" width="230" height="90" rx="8" fill="#f6f8fa" stroke="#2a78d6" stroke-width="1.8"/><text x="752" y="42" font-weight="600" fill="#1f2328">Follower</text><text x="752" y="62" font-size="12" fill="#59636e">applies shipped WAL records</text><text x="752" y="78" font-size="12" fill="#59636e">promote on leader failure</text>
<line x1="560" y1="50" x2="738" y2="50" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/><text x="574" y="42" font-size="11.5" fill="#59636e">sync: ack after follower</text>
<line x1="560" y1="85" x2="738" y2="85" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="574" y="102" font-size="11.5" fill="#59636e">async: ship every 50 ms</text>
<rect x="30" y="150" width="940" height="200" rx="10" fill="none" stroke="#8c959f" stroke-dasharray="4 4"/>
<text x="44" y="172" font-weight="600" fill="#59636e">LSM engine (lsmkv/engine)</text>
<rect x="50" y="190" width="200" height="140" rx="8" fill="#f6f8fa" stroke="#eb6834" stroke-width="1.8"/><text x="62" y="212" font-weight="600" fill="#1f2328">1. WAL</text><text x="62" y="232" font-size="12" fill="#59636e">CRC per record</text><text x="62" y="248" font-size="12" fill="#59636e">fsync before ack</text><text x="62" y="264" font-size="12" fill="#59636e">torn tail truncated</text><text x="62" y="280" font-size="12" fill="#59636e">on replay</text>
<rect x="280" y="190" width="200" height="140" rx="8" fill="#f6f8fa" stroke="#eb6834" stroke-width="1.8"/><text x="292" y="212" font-weight="600" fill="#1f2328">2. Memtable</text><text x="292" y="232" font-size="12" fill="#59636e">skip list</text><text x="292" y="248" font-size="12" fill="#59636e">flush at size limit</text><text x="292" y="264" font-size="12" fill="#59636e">tombstones for deletes</text>
<rect x="510" y="190" width="210" height="140" rx="8" fill="#f6f8fa" stroke="#1baf7a" stroke-width="1.8"/><text x="522" y="212" font-weight="600" fill="#1f2328">3. SSTables</text><text x="522" y="232" font-size="12" fill="#59636e">sorted, immutable</text><text x="522" y="248" font-size="12" fill="#59636e">sparse index + bloom</text><text x="522" y="264" font-size="12" fill="#59636e">whole-file checksum</text><text x="522" y="280" font-size="12" fill="#59636e">tmp + fsync + rename</text>
<rect x="750" y="190" width="200" height="140" rx="8" fill="#f6f8fa" stroke="#1baf7a" stroke-width="1.8"/><text x="762" y="212" font-weight="600" fill="#1f2328">4. Compaction</text><text x="762" y="232" font-size="12" fill="#59636e">size-tiered k-way merge</text><text x="762" y="248" font-size="12" fill="#59636e">newest wins</text><text x="762" y="264" font-size="12" fill="#59636e">drops tombstones</text><text x="762" y="280" font-size="12" fill="#59636e">at the bottom tier</text>
<line x1="410" y1="110" x2="150" y2="188" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="250" y1="260" x2="278" y2="260" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="480" y1="260" x2="508" y2="260" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="720" y1="245" x2="748" y2="245" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="748" y1="275" x2="722" y2="275" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="530" y="345" font-size="11.5" fill="#59636e">MANIFEST (fsync + rename) is the commit point for flushes and compactions</text>
<rect x="30" y="390" width="220" height="110" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="1.8"/><text x="42" y="412" font-weight="600" fill="#1f2328">Prometheus</text><text x="42" y="432" font-size="12" fill="#59636e">8 alert rules (ops/alerts.yml)</text><text x="42" y="448" font-size="12" fill="#59636e">scrapes /metrics: latency,</text><text x="42" y="464" font-size="12" fill="#59636e">fsync, backlog, lag, disk</text>
<rect x="280" y="390" width="200" height="110" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="1.8"/><text x="292" y="412" font-weight="600" fill="#1f2328">Runbooks</text><text x="292" y="432" font-size="12" fill="#59636e">one per alert</text><text x="292" y="448" font-size="12" fill="#59636e">ops/runbooks/</text>
<rect x="510" y="390" width="210" height="110" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="1.8"/><text x="522" y="412" font-weight="600" fill="#1f2328">Backup</text><text x="522" y="432" font-size="12" fill="#59636e">snapshot + archived WAL</text><text x="522" y="448" font-size="12" fill="#59636e">point-in-time restore</text>
<rect x="750" y="390" width="220" height="110" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="1.8"/><text x="762" y="412" font-weight="600" fill="#1f2328">Chaos + CI gate</text><text x="762" y="432" font-size="12" fill="#59636e">SIGKILL at engine points</text><text x="762" y="448" font-size="12" fill="#59636e">release blocked unless</text><text x="762" y="464" font-size="12" fill="#59636e">0 acked writes lost</text>
</svg>